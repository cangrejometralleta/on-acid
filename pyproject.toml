[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "on-acid"
version = "0.2.0"
description = "Acid-base equilibrium without solving a quadratic by hand."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["chemistry", "equilibrium", "ph", "titration", "buffer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
]

[project.scripts]
on-acid = "dissociation:demo"

[project.urls]
Homepage = "https://github.com/cangrejometralleta/on-acid"
Source = "https://github.com/cangrejometralleta/on-acid"

[tool.setuptools]
py-modules = ["dissociation"]

[tool.ruff]
line-length = 100

# The gate Catches bugs, never taste. The aligned tables in `dissociation.py`
# and the order of `__all__` are Deliberate, so no formatter Reflows them.
[tool.ruff.lint]
select = ["E", "F", "B"]
